<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Weekly AI Agents Architecture Exam</title>
  <style>
    :root { color-scheme: light dark; --bg:#f6f7f9; --card:#fff; --text:#111827; --muted:#6b7280; --border:#d1d5db; --accent:#2563eb; --ok:#166534; --bad:#991b1b; }
    @media (prefers-color-scheme: dark){:root{--bg:#0b1020;--card:#111827;--text:#f3f4f6;--muted:#9ca3af;--border:#374151;--accent:#60a5fa;--ok:#86efac;--bad:#fca5a5}}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}.wrap{max-width:900px;margin:auto;padding:24px}.hero{margin-bottom:24px}.hero h1{margin:0 0 8px;font-size:clamp(1.6rem,4vw,2.4rem)}.muted{color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0}.stat,.question,.result{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px}.stat b{display:block;font-size:1.5rem}.question{margin:14px 0}.question h3{margin:0 0 12px;font-size:1rem}.option{display:flex;gap:10px;align-items:flex-start;padding:8px 0}.option input{margin-top:4px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:24px 0}.btn{border:1px solid var(--border);border-radius:10px;padding:11px 16px;font-weight:600;background:var(--card);color:var(--text);cursor:pointer}.btn.primary{background:var(--accent);color:white;border-color:var(--accent)}.btn:disabled{opacity:.5;cursor:not-allowed}.hidden{display:none}.score{font-size:2rem;font-weight:700}.domain{margin:10px 0}.bar{height:10px;border-radius:10px;background:var(--border);overflow:hidden}.bar span{display:block;height:100%;background:var(--accent)}.review-item{border-top:1px solid var(--border);padding:12px 0}.correct{color:var(--ok);font-weight:700}.incorrect{color:var(--bad);font-weight:700}@media(max-width:600px){.wrap{padding:16px}.stats{grid-template-columns:1fr}.question{padding:14px}}
  </style>
</head>
<body>
<main class="wrap">
  <section class="hero">
    <h1>Weekly AI Agents Architecture Exam</h1>
    <div class="muted">Based on material published 17–23 Aug 2026 · 20 MCQs · explanations after submission</div>
    <div class="stats"><div class="stat"><span class="muted">Questions</span><b>20</b></div><div class="stat"><span class="muted">Marks</span><b>20</b></div><div class="stat"><span class="muted">Level</span><b>Architect</b></div></div>
  </section>
  <div id="quiz"></div>
  <div class="actions"><button id="submit" class="btn primary">Submit Exam</button><button id="reset" class="btn">Reset</button><span id="status" class="muted"></span></div>
  <section id="results" class="hidden"></section>
</main>
<script>
const qs=[
{d:'Planning',q:'Your migration factory has mandatory stages /discover → /normalize → /plan → /execute → /review → /parity-test. Inside /execute, the next action depends on compiler feedback. Which design best matches the week’s planning guidance?',o:['Let the LLM plan the entire workflow from scratch','Keep stage transitions deterministic and allow bounded model planning only inside /execute','Encode every possible compiler branch in one static workflow','Let the model skip stages when confidence is high'],a:1,e:'The recommended pattern is deterministic outer workflow plus bounded model-driven planning where local uncertainty genuinely exists.'},
{d:'Planning',q:'A planner proposes deploy_to_prod during a migration execution stage where deployment is not an allowed action. What should happen?',o:['Execute because the planner produced a reason','Validate the planned action against the stage contract and reject it','Ask a second model whether deployment seems reasonable','Add deploy_to_prod to the tool list automatically'],a:1,e:'A plan is model output, not authority. The harness must validate proposed actions against stage, policy and capability constraints.'},
{d:'Planning',q:'When is step-by-step planning generally preferable to plan-then-execute?',o:['When every step is known before execution','When tool observations strongly determine what should happen next','When the process must be completely deterministic','When no tools are available'],a:1,e:'Step-by-step planning is strongest when fresh observations, such as compiler or test results, materially change the next action.'},
{d:'Planning',q:'Which contract should prove that a migration execution stage is complete?',o:['The planner’s final natural-language statement','The number of planning steps used','Deterministic success criteria such as build/tests and unresolved-connector checks','The model’s confidence score'],a:2,e:'The success contract should be external and deterministic where possible; the planner does not own completion authority.'},
{d:'Loop Engineering',q:'An agent runs read → edit → compile and sees the identical compiler error three times. What is the correct loop response?',o:['Retry the same sequence indefinitely with higher temperature','Treat activity as progress because files were edited','Detect the repeated state/action/outcome pattern and trigger recovery or re-planning','Increase the maximum token budget only'],a:2,e:'Repeated identical failure is a stall signal. Recovery must change strategy rather than merely repeat the same operation.'},
{d:'Loop Engineering',q:'Which failure should normally be retried with backoff without asking the model to reinterpret the task?',o:['HTTP 503 from a dependency','Write outside the authorized workspace','Missing required source artifact','Public API change requiring approval'],a:0,e:'Transient infrastructure failures are candidates for operational retry; policy, approval and permanent failures have different semantics.'},
{d:'Loop Engineering',q:'Why is a global max_steps limit insufficient as the only loop safeguard?',o:['It cannot prevent any infinite loop','It bounds total work but detects wasted repetitive behavior only after much of the budget may be consumed','It prevents deterministic validation','It makes checkpointing impossible'],a:1,e:'A max-step cap is necessary but not enough; progress signals, stall detection and failure classification catch waste earlier.'},
{d:'Loop Engineering',q:'What is the strongest evidence that a long-running agent is progressing?',o:['Tool-call count is increasing','The transcript is getting longer','Task-specific progress signals improve, such as fewer compiler errors or more parity tests passing','The model repeatedly says it is making progress'],a:2,e:'Progress must measure movement toward acceptance criteria, not mere activity.'},
{d:'Skills',q:'What is the clearest architectural distinction between a tool and a skill?',o:['A tool provides executable capability; a skill packages reusable procedure and domain knowledge','A skill executes commands while a tool only contains documentation','They are equivalent abstractions','A tool is always model-specific while a skill is always cloud-specific'],a:0,e:'Tools are executable capabilities. Skills teach when and how to apply procedures, knowledge, scripts, references and examples.'},
{d:'Skills',q:'Why should a skill catalog inject only names/descriptions initially instead of every full SKILL.md?',o:['Models cannot read Markdown','Progressive disclosure reduces irrelevant context and loads details only after selection','Full skill bodies cannot be versioned','Descriptions automatically grant tool permissions'],a:1,e:'Progressive disclosure keeps discovery cheap and focused while preserving deeper material for selected skills.'},
{d:'Skills',q:'A skill package contains parse_xml.py. Who should decide whether that script is authorized to execute?',o:['The skill instructions themselves','The model because it selected the skill','The harness/runtime policy and sandbox','The catalog search index'],a:2,e:'Skill discovery never grants authority. Script execution remains governed by harness policy, sandboxing and runtime controls.'},
{d:'Skills',q:'Why should a production run resolve an exact approved skill version rather than latest?',o:['Exact versions use fewer tokens','Pinning versions makes behavior reproducible and prevents silent mid-run changes','Latest cannot contain scripts','Semantic search requires semantic versioning'],a:1,e:'Immutable version pinning supports replay, auditability and controlled promotion.'},
{d:'Skills',q:'A migration fails because the candidate retriever never surfaced the correct skill. Which eval layer should be fixed first?',o:['Skill instruction quality','Selection/retrieval evaluation','End-to-end workflow only','Tool latency'],a:1,e:'If the right skill was never surfaced, rewriting SKILL.md is unlikely to help. Diagnose candidate recall and selection first.'},
{d:'Context Engineering',q:'Where should authoritative facts such as current phase, retry budget and approval status primarily live?',o:['Only in conversational history','In structured state outside the model, rendered into context as needed','Inside a vector index only','Only in the selected skill'],a:1,e:'Authoritative execution facts should be persisted as structured state rather than existing only in natural-language history.'},
{d:'Context Engineering',q:'A build tool produces 50,000 lines of logs. What should the context builder usually do?',o:['Inject the complete log into every subsequent model call','Discard the log permanently','Provide a structured summary plus a reference/tool for focused retrieval of deeper details','Store the entire log in the system prompt'],a:2,e:'Tool observations are context too. High-volume outputs should be summarized and referenced so the model sees high-signal evidence.'},
{d:'Context Engineering',q:'What should compaction preserve most carefully in a long-running migration?',o:['Every intermediate tool message verbatim','Original goals, acceptance criteria, decisions, approvals, unresolved risks and durable artifact references','Only the most recent model response','All retrieved documents regardless of relevance'],a:1,e:'Compaction should remove obsolete chatter while preserving the information required to resume safely and correctly.'},
{d:'Context Engineering',q:'Why does a very large context window not remove the need for context engineering?',o:['Large models cannot use tools','Capacity does not guarantee relevance; stale/noisy information can still raise cost and reduce decision quality','Large context windows cannot contain source code','Context engineering is required only for small models'],a:1,e:'The objective is the smallest high-signal working set, not maximum occupancy of the context window.'},
{d:'RAG Evaluation',q:'Retrieval returned the required retry-pattern document at rank 4, but the context builder retained only the top 3 chunks. The answer was wrong. What failed?',o:['Retrieval','Context assembly','Embedding generation only','The evaluation dataset'],a:1,e:'The retriever found the evidence, but the final model context dropped it. That is a context-assembly failure.'},
{d:'RAG Evaluation',q:'The required document appears in retrieval and final context, the context is sufficient, but the model gives an unsupported answer. What should be investigated first?',o:['Generation/reasoning and grounding behavior','Increase top-K immediately','Replace the vector database','Remove evaluation traces'],a:0,e:'When retrieval and assembled context are good, the remaining defect is downstream in generation, reasoning or grounding.'},
{d:'RAG Evaluation',q:'Why should a RAG trace persist both retrieved candidate IDs and final-context IDs?',o:['To increase token usage','To distinguish retrieval failures from reranking/filtering/context-assembly failures','Because the LLM requires document IDs','To avoid maintaining evaluation datasets'],a:1,e:'The two boundaries let you determine whether evidence was never found or was found and later lost before generation.'}
];
const quiz=document.getElementById('quiz');
qs.forEach((x,i)=>{const s=document.createElement('section');s.className='question';s.innerHTML=`<h3>${i+1}. ${x.q}</h3>`;x.o.forEach((v,j)=>{const row=document.createElement('label');row.className='option';row.innerHTML=`<input type="radio" name="q${i}" value="${j}"><span>${v}</span>`;s.appendChild(row)});quiz.appendChild(s)});
function level(n){if(n>=18)return['Architect-level','You can distinguish the control-plane boundaries across planning, loops, skills, context and RAG evaluation.'];if(n>=15)return['Strong','Good architectural understanding; revisit the domains where the score falls below 75%.'];if(n>=11)return['Developing','Core concepts are present, but some boundaries between model judgment and deterministic control need reinforcement.'];return['Foundation','Revisit the week’s core mental models before adding more autonomous behavior.']}
function submit(){const picks=[],missing=[];qs.forEach((_,i)=>{const e=document.querySelector(`input[name=q${i}]:checked`);picks.push(e?+e.value:null);if(!e)missing.push(i+1)});if(missing.length){document.getElementById('status').textContent=`Answer all questions. Missing: ${missing.join(', ')}`;return}let score=0;const ds={};qs.forEach((x,i)=>{ds[x.d]??={c:0,t:0};ds[x.d].t++;if(picks[i]===x.a){score++;ds[x.d].c++}});const [lv,msg]=level(score),out=document.getElementById('results');out.classList.remove('hidden');let html=`<div class="result"><div class="muted">Score</div><div class="score">${score}/20</div><h2>${lv}</h2><p>${msg}</p></div><div class="result"><h2>Domain assessment</h2>`;Object.entries(ds).forEach(([k,v])=>{const p=Math.round(v.c/v.t*100);html+=`<div class="domain"><div>${k}: <b>${v.c}/${v.t}</b> · ${p}%</div><div class="bar"><span style="width:${p}%"></span></div></div>`});html+='</div><div class="result"><h2>Answer review</h2>';qs.forEach((x,i)=>{const ok=picks[i]===x.a;html+=`<div class="review-item"><div class="${ok?'correct':'incorrect'}">${i+1}. ${ok?'Correct':'Incorrect'}</div><div>Your answer: ${x.o[picks[i]]}</div>${ok?'':`<div>Correct answer: ${x.o[x.a]}</div>`}<div class="muted">${x.e}</div></div>`});html+='</div>';out.innerHTML=html;document.querySelectorAll('input[type=radio]').forEach(x=>x.disabled=true);document.getElementById('submit').disabled=true;document.getElementById('status').textContent='Exam submitted.';out.scrollIntoView({behavior:'smooth'})}
document.getElementById('submit').addEventListener('click',submit);document.getElementById('reset').addEventListener('click',()=>{document.querySelectorAll('input[type=radio]').forEach(x=>{x.checked=false;x.disabled=false});document.getElementById('results').classList.add('hidden');document.getElementById('results').innerHTML='';document.getElementById('submit').disabled=false;document.getElementById('status').textContent=''});
</script>
</body>
</html>
