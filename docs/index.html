<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Weekly AI Architecture Exams</title>
  <style>
    :root{color-scheme:light dark;--bg:#f3f4f6;--panel:#ffffff;--text:#111827;--muted:#6b7280;--border:#d1d5db;--accent:#2563eb;--accent-soft:#dbeafe}
    @media(prefers-color-scheme:dark){:root{--bg:#080d19;--panel:#111827;--text:#f3f4f6;--muted:#9ca3af;--border:#374151;--accent:#60a5fa;--accent-soft:#172554}}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
    .app{min-height:100vh;display:grid;grid-template-columns:310px minmax(0,1fr)}
    aside{background:var(--panel);border-right:1px solid var(--border);padding:22px 16px;position:sticky;top:0;height:100vh;overflow:auto}
    h1{font-size:1.35rem;margin:0 0 5px}.muted{color:var(--muted)}.intro{font-size:.9rem;margin-bottom:20px}
    .latest{display:inline-block;font-size:.75rem;font-weight:700;background:var(--accent-soft);color:var(--accent);padding:3px 8px;border-radius:999px;margin-bottom:12px}
    .exam-list{display:flex;flex-direction:column;gap:8px}.exam-link{display:block;text-decoration:none;color:var(--text);border:1px solid var(--border);border-radius:11px;padding:11px 12px;background:transparent}.exam-link:hover{border-color:var(--accent)}.exam-link.active{border-color:var(--accent);background:var(--accent-soft)}.exam-date{font-weight:700}.exam-week,.exam-title{display:block;color:var(--muted);font-size:.82rem;margin-top:2px}
    main{min-width:0;display:flex;flex-direction:column;height:100vh}.toolbar{background:var(--panel);border-bottom:1px solid var(--border);padding:11px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}.toolbar strong{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.open-link{color:var(--accent);text-decoration:none;font-weight:600;white-space:nowrap}.frame-wrap{flex:1;min-height:0}.frame-wrap iframe{width:100%;height:100%;border:0;background:var(--bg)}
    .error{padding:20px;color:var(--muted)}
    @media(max-width:760px){.app{grid-template-columns:1fr}aside{position:relative;height:auto;border-right:0;border-bottom:1px solid var(--border);padding:16px}.exam-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}main{height:78vh}.exam-title{display:none}}
    @media(max-width:470px){.exam-list{grid-template-columns:1fr}.toolbar{align-items:flex-start;flex-direction:column}}
  </style>
</head>
<body>
<div class="app">
  <aside>
    <div class="latest">WEEKLY ARCHIVE</div>
    <h1>AI Architecture Exams</h1>
    <div class="intro muted">The newest exam opens automatically. Select any previous week to revisit it.</div>
    <nav id="examList" class="exam-list" aria-label="Weekly exams"></nav>
  </aside>
  <main>
    <div class="toolbar">
      <strong id="currentTitle">Loading latest exam…</strong>
      <a id="openLink" class="open-link" href="#" target="_blank" rel="noopener">Open exam directly</a>
    </div>
    <div id="frameWrap" class="frame-wrap"><iframe id="examFrame" title="Weekly AI exam"></iframe></div>
  </main>
</div>
<script>
const bootstrap=[
  {date:'2026-09-06',week:'31 Aug–6 Sep 2026',title:'Multi-agent governance, durable execution and tool contracts',file:'exams/2026-09-06.html'},
  {date:'2026-08-30',week:'24–30 Aug 2026',title:'Agentic RAG, observability and evaluation release gates',file:'exams/2026-08-30.html'},
  {date:'2026-08-23',week:'17–23 Aug 2026',title:'Planning, loop engineering, skills and context engineering',file:'exams/2026-08-23.html'},
  {date:'2026-08-16',week:'Initial weekly assessment',title:'Coding agents, harnesses, frameworks, memory and guardrails',file:'exams/2026-08-16.html'}
];
let exams=bootstrap;
const list=document.getElementById('examList');
const frame=document.getElementById('examFrame');
const currentTitle=document.getElementById('currentTitle');
const openLink=document.getElementById('openLink');
function formatDate(iso){return new Date(iso+'T00:00:00').toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})}
function selectExam(exam,pushHash=true){
  document.querySelectorAll('.exam-link').forEach(a=>a.classList.toggle('active',a.dataset.date===exam.date));
  frame.src=exam.file;
  currentTitle.textContent=`${formatDate(exam.date)} — ${exam.title}`;
  openLink.href=exam.file;
  if(pushHash) history.replaceState(null,'','#'+exam.date);
}
function render(){
  exams=[...exams].sort((a,b)=>b.date.localeCompare(a.date));
  list.innerHTML='';
  exams.forEach((exam,i)=>{
    const a=document.createElement('a');
    a.href=exam.file;a.className='exam-link';a.dataset.date=exam.date;
    a.innerHTML=`<span class="exam-date">${formatDate(exam.date)}${i===0?' · Latest':''}</span><span class="exam-week">${exam.week}</span><span class="exam-title">${exam.title}</span>`;
    a.addEventListener('click',e=>{e.preventDefault();selectExam(exam)});
    list.appendChild(a);
  });
  const requested=location.hash.slice(1);
  const selected=exams.find(x=>x.date===requested)||exams[0];
  if(selected) selectExam(selected,false);
}
render();
fetch('exams/exams.json?ts='+Date.now(),{cache:'no-store'})
  .then(r=>{if(!r.ok)throw new Error('manifest');return r.json()})
  .then(data=>{if(Array.isArray(data)&&data.length){exams=data;render()}})
  .catch(()=>{});
</script>
</body>
</html>
