<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Weekly AI Agents Architecture Exam</title>
  <style>
    :root { color-scheme: light dark; --bg:#f6f7f9; --card:#fff; --text:#111827; --muted:#6b7280; --border:#d1d5db; --accent:#2563eb; --ok:#166534; --bad:#991b1b; }
    @media (prefers-color-scheme: dark){:root{--bg:#0b1020;--card:#111827;--text:#f3f4f6;--muted:#9ca3af;--border:#374151;--accent:#60a5fa;--ok:#86efac;--bad:#fca5a5}}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}.wrap{max-width:900px;margin:auto;padding:24px}.hero{margin-bottom:24px}.hero h1{margin:0 0 8px;font-size:clamp(1.6rem,4vw,2.4rem)}.muted{color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0}.stat,.question,.result{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px}.stat b{display:block;font-size:1.5rem}.question{margin:14px 0}.question h3{margin:0 0 12px;font-size:1rem}.option{display:flex;gap:10px;align-items:flex-start;padding:8px 0}.option input{margin-top:4px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:24px 0}.btn{border:1px solid var(--border);border-radius:10px;padding:11px 16px;font-weight:600;background:var(--card);color:var(--text);cursor:pointer}.btn.primary{background:var(--accent);color:white;border-color:var(--accent)}.btn:disabled{opacity:.5;cursor:not-allowed}.hidden{display:none}.score{font-size:2rem;font-weight:700}.domain{margin:10px 0}.bar{height:10px;border-radius:10px;background:var(--border);overflow:hidden}.bar span{display:block;height:100%;background:var(--accent)}.review-item{border-top:1px solid var(--border);padding:12px 0}.correct{color:var(--ok);font-weight:700}.incorrect{color:var(--bad);font-weight:700}@media(max-width:600px){.wrap{padding:16px}.stats{grid-template-columns:1fr}.question{padding:14px}}
  </style>
</head>
<body>
<main class="wrap">
  <section class="hero">
    <h1>Weekly AI Agents Architecture Exam</h1>
    <div class="muted">Based on material published 31 Aug–6 Sep 2026 · 20 MCQs · explanations after submission</div>
    <div class="stats"><div class="stat"><span class="muted">Questions</span><b>20</b></div><div class="stat"><span class="muted">Marks</span><b>20</b></div><div class="stat"><span class="muted">Level</span><b>Architect</b></div></div>
  </section>
  <div id="quiz"></div>
  <div class="actions"><button id="submit" class="btn primary">Submit Exam</button><button id="reset" class="btn">Reset</button><span id="status" class="muted"></span></div>
  <section id="results" class="hidden"></section>
</main>
<script>
const qs=[
{d:'Multi-Agent Design',q:'A migration workflow has deterministic XML parsing, repository search, semantic analysis, and parity-test design. Which decomposition best follows the week’s multi-agent guidance?',o:['Create one agent for every processing step','Use one manager plus tools for deterministic capabilities, adding specialist agents only for bounded reasoning tasks such as semantic analysis or parity design','Use a handoff for every tool call','Put all functions into one specialist registry and let agents invoke each other freely'],a:1,e:'A tool is a capability; a specialist agent is a delegated decision-making boundary. Deterministic work should normally remain a tool.'},
{d:'Multi-Agent Design',q:'When is a handoff preferable to manager-as-orchestrator?',o:['When the manager must compare several specialist outputs','When ownership of the conversation itself should transfer to a specialist','Whenever token cost is high','Whenever the target agent has more tools'],a:1,e:'A handoff transfers ownership. Manager-style orchestration is better when one component must retain final responsibility and synthesis.'},
{d:'Multi-Agent Design',q:'Two specialists independently inspect source semantics and parity requirements. Why might running them in parallel be justified?',o:['Parallelism always improves reasoning quality','Their work packages are independent and do not require each other’s intermediate results','It avoids the need for typed contracts','It guarantees lower token use'],a:1,e:'Parallel execution is appropriate for genuinely independent reasoning streams, not merely to make the architecture look multi-agent.'},
{d:'Context & Contracts',q:'What is the strongest default for passing context to a specialist agent?',o:['Forward the full parent conversation and every prior tool result','Build a minimal task packet from authoritative state containing goal, scope, evidence, constraints, and output schema','Send only a natural-language summary generated by another model','Give every specialist access to the same shared memory'],a:1,e:'The goal is minimum sufficient context. The coordinator should construct a bounded task packet from authoritative state.'},
{d:'Context & Contracts',q:'Which statement best distinguishes run context from model context?',o:['Run context is hidden chain-of-thought; model context is user-visible text','Run context is application-owned state and services; model context is the selected information actually sent to the LLM','Run context is only for cloud deployments','There is no architectural difference'],a:1,e:'Run context includes identity, tenant, policy, repositories and service clients. Model context is the subset exposed to the model for the current decision.'},
{d:'Context & Contracts',q:'Why are typed specialist outputs preferable to free-form prose?',o:['They make models deterministic','They allow the coordinator to validate, trace, evaluate, and consume results as stable application contracts','They eliminate the need for retrieval','They allow specialists to bypass authorization'],a:1,e:'Typed outputs reduce ambiguity between agents and make delegation behave like a governed internal service boundary.'},
{d:'Delegation Governance',q:'A reviewer agent wants to send work back to codegen for a second repair cycle, but policy allows only one. Who should decide whether the handoff is allowed?',o:['The reviewer prompt','The target codegen agent','A deterministic delegation controller in the harness','The model provider'],a:2,e:'The model may propose delegation, but the harness owns route, depth, budget, authorization and repair-loop policy.'},
{d:'Delegation Governance',q:'Which architecture best prevents privilege escalation across specialists?',o:['Give every agent the broadest shared token and rely on prompts','Keep least-privileged tool allowlists and identity checks outside model-visible context','Pass credentials inside the specialist task packet','Let the manager temporarily lend its credentials to any specialist'],a:1,e:'Specialists should receive only the capabilities they need, while authorization remains deterministic runtime logic.'},
{d:'Delegation Governance',q:'What is the main risk of a fully connected agent graph?',o:['It prevents handoffs','It increases unpredictable paths, looping possibilities, testing complexity, and privilege ambiguity','It disables structured output','It forces all agents to use the same model'],a:1,e:'Every additional delegation edge expands the reachable behavior and therefore the governance and testing surface.'},
{d:'Durable Execution',q:'A migration workflow crashes after successfully creating a Git branch but before persisting the next step. What is the safest recovery model?',o:['Restart the whole agent and let it infer what already happened from chat history','Resume from durable checkpoint state and use a stable idempotency key or reconciliation before repeating the side effect','Generate a new branch name and continue','Ask a reviewer agent to guess whether the branch exists'],a:1,e:'Recovery must rely on durable state and external evidence, not model memory. Side effects must be deduplicated or reconciled.'},
{d:'Durable Execution',q:'Which statement correctly distinguishes retry from resume?',o:['Retry and resume are equivalent','Retry repeats an operation; resume continues a workflow from persisted progress','Resume applies only to LLM calls','Retry requires a workflow engine but resume does not'],a:1,e:'Retry concerns one operation; resume concerns the durable progress of the larger workflow.'},
{d:'Durable Execution',q:'Why is the window “external API succeeds, process crashes, journal update never happens” especially dangerous?',o:['The model will lose its prompt','Local state can say the operation is incomplete even though the outside world already changed','The external API becomes non-idempotent automatically','The workflow cannot be traced'],a:1,e:'The caller may retry a side effect that actually succeeded. Native idempotency or reconciliation is needed to close this ambiguity.'},
{d:'Saga & Compensation',q:'A migration publishes an API catalog entry, then parity testing fails. Which statement best reflects saga compensation?',o:['Every prior action must be technically reversed','Compensation is a new business action that makes prior side effects safe or semantically neutral; sometimes that means changing status rather than deleting','The LLM should invent the rollback after observing the error','All systems should participate in one distributed transaction'],a:1,e:'Compensation is semantic, not a database rollback. Marking an artifact FAILED_VALIDATION can be safer than deleting it.'},
{d:'Saga & Compensation',q:'Which component should decide whether to retry, compensate, pause for approval, or escalate?',o:['The failing tool','The LLM planner without constraints','Deterministic recovery policy in the workflow harness','The vector database'],a:2,e:'The LLM can recommend, but recovery transitions affecting real systems should be registered and policy-controlled.'},
{d:'Saga & Compensation',q:'Why must compensation handlers themselves be idempotent?',o:['Because compensation may also crash and be retried','Because idempotency is required only for reads','Because compensation always runs twice','Because it reduces token usage'],a:0,e:'Recovery code can fail too. Re-running compensation must not create further damage or duplicate corrective actions.'},
{d:'Reconciliation',q:'A POST to publish an API times out after 30 seconds. What should the harness infer immediately?',o:['The publication definitely failed','The publication definitely succeeded','The transport result is ambiguous; observe authoritative external state before deciding','The safest option is always to compensate'],a:2,e:'A timeout means the caller lacks a result, not that the side effect did or did not happen.'},
{d:'Reconciliation',q:'The external catalog contains the requested API version, but its specification hash differs from the intended hash. What is the correct reconciliation classification?',o:['CONFIRMED','SAFE_TO_RETRY','CONFLICT','TRANSIENT_FAILURE'],a:2,e:'Existence alone is insufficient. Reconciliation must compare business invariants such as version and content hash.'},
{d:'Reconciliation',q:'What should happen before retrying a high-value non-idempotent write with an unknown outcome?',o:['Ask the LLM to estimate probability of success','Probe the system of record and reconcile intended state against observed state','Increase the timeout and immediately call again','Generate a new operation key'],a:1,e:'Reconcile first. A stable operation key plus authoritative read is the safe path through ambiguous outcomes.'},
{d:'Tool Contracts',q:'Why is a normal function signature insufficient as an enterprise agent tool contract?',o:['Functions cannot be called by LLMs','It usually does not express effect class, approval needs, retry semantics, idempotency, reconciliation, authorization scope, or observability requirements','Functions cannot have typed inputs','It prevents use of MCP'],a:1,e:'Reliable operation requires both a functional contract and an operational contract.'},
{d:'Tool Contracts',q:'Which statement best captures the intended separation of responsibility in a governed tool architecture?',o:['LLM chooses intent; harness enforces execution semantics; tool performs the side effect','LLM chooses intent and authorization; tool decides whether to retry','Tool annotations from any MCP server are authoritative security policy','The model should decide if approval is necessary after execution'],a:0,e:'The model selects capability intent, deterministic runtime policy governs execution, and the tool implementation performs the actual operation.'}
];
const quiz=document.getElementById('quiz');
qs.forEach((x,i)=>{const s=document.createElement('section');s.className='question';s.innerHTML=`<h3>${i+1}. ${x.q}</h3>`;x.o.forEach((v,j)=>{const row=document.createElement('label');row.className='option';row.innerHTML=`<input type="radio" name="q${i}" value="${j}"><span>${v}</span>`;s.appendChild(row)});quiz.appendChild(s)});
function level(n){if(n>=18)return['Architect-level','You can connect multi-agent boundaries, governance, durable execution, sagas, reconciliation, and tool policy into a coherent control plane.'];if(n>=15)return['Strong','Good architectural understanding; revisit any domain below 75%.'];if(n>=11)return['Developing','Core concepts are present, but some boundaries between model reasoning and deterministic control-plane responsibility need reinforcement.'];return['Foundation','Revisit the week’s progression: bounded specialists, governed delegation, durable state, safe recovery, reconciliation, and operational tool contracts.']}
function submit(){const picks=[],missing=[];qs.forEach((_,i)=>{const e=document.querySelector(`input[name=q${i}]:checked`);picks.push(e?+e.value:null);if(!e)missing.push(i+1)});if(missing.length){document.getElementById('status').textContent=`Answer all questions. Missing: ${missing.join(', ')}`;return}let score=0;const ds={};qs.forEach((x,i)=>{ds[x.d]??={c:0,t:0};ds[x.d].t++;if(picks[i]===x.a){score++;ds[x.d].c++}});const [lv,msg]=level(score),out=document.getElementById('results');out.classList.remove('hidden');let html=`<div class="result"><div class="muted">Score</div><div class="score">${score}/20</div><h2>${lv}</h2><p>${msg}</p></div><div class="result"><h2>Domain assessment</h2>`;Object.entries(ds).forEach(([k,v])=>{const p=Math.round(v.c/v.t*100);html+=`<div class="domain"><div>${k}: <b>${v.c}/${v.t}</b> · ${p}%</div><div class="bar"><span style="width:${p}%"></span></div></div>`});html+='</div><div class="result"><h2>Answer review</h2>';qs.forEach((x,i)=>{const ok=picks[i]===x.a;html+=`<div class="review-item"><div class="${ok?'correct':'incorrect'}">${i+1}. ${ok?'Correct':'Incorrect'}</div><div>Your answer: ${x.o[picks[i]]}</div>${ok?'':`<div>Correct answer: ${x.o[x.a]}</div>`}<div class="muted">${x.e}</div></div>`});html+='</div>';out.innerHTML=html;document.querySelectorAll('input[type=radio]').forEach(x=>x.disabled=true);document.getElementById('submit').disabled=true;document.getElementById('status').textContent='Exam submitted.';out.scrollIntoView({behavior:'smooth'})}
document.getElementById('submit').addEventListener('click',submit);document.getElementById('reset').addEventListener('click',()=>{document.querySelectorAll('input[type=radio]').forEach(x=>{x.checked=false;x.disabled=false});document.getElementById('results').classList.add('hidden');document.getElementById('results').innerHTML='';document.getElementById('submit').disabled=false;document.getElementById('status').textContent=''});
</script>
</body>
</html>
