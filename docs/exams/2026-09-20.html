<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Weekly AI Architecture Exam — 2026-09-20</title><style>body{font:16px/1.5 system-ui;max-width:900px;margin:auto;padding:24px;background:#f6f7f9;color:#111827}.q,#results{background:white;border:1px solid #ddd;border-radius:12px;padding:16px;margin:12px 0}label{display:block;padding:6px}button{padding:10px 16px;margin:12px 8px 12px 0}#submit{background:#2563eb;color:white;border:0;border-radius:8px}.muted{color:#666}.hidden{display:none}.bar{height:9px;background:#ddd}.bar i{display:block;height:100%;background:#2563eb}@media(prefers-color-scheme:dark){body{background:#0b1020;color:#eee}.q,#results{background:#111827;border-color:#374151}.muted{color:#aaa}}</style></head><body><h1>Weekly AI Agents Architecture Exam</h1><p class=muted>Based on material published 14–20 Sep 2026 · 20 MCQs · explanations after submission</p><div id=quiz></div><button id=submit>Submit Exam</button><button onclick="location.reload()">Reset</button><span id=status></span><div id=results class=hidden></div><script>const Q=[
['Adaptive Routing','A migration agent uses its strongest model for file inventory, code generation, and semantic repair. Better architecture?',['One model per run','Route each bounded step to the least expensive approved profile that reliably meets its risk and quality needs','Always start cheap and retry indefinitely','Let the LLM freely select any model'],1,'Route per step using task difficulty, risk, budget and quality gates.'],
['Adaptive Routing','A cheap profile fails a deterministic quality gate on a high-risk repair. What next?',['Accept it','Controlled escalation to a stronger approved profile if budget permits','Repeat indefinitely','Remove the gate'],1,'Observable quality failure is a valid, bounded escalation signal.'],
['Adaptive Routing','Why is prompt length alone a weak routing signal?',['Long prompts are always easy','Difficulty and risk are not determined by length','Tokens cannot be measured','Only tool count matters'],1,'Short tasks can be high-risk; routing needs richer signals.'],
['Evaluation Routing','Economy passes inventory at 98%, Standard 99%, Deep 99%; requirement is 95%. Best route if all safety gates pass?',['Deep','Standard','Economy with sufficient reliability margin','Random rotation'],2,'Use the least expensive profile that reliably clears all gates.'],
['Evaluation Routing','What should offline evaluation publish for runtime routing?',['A prompt asking the model','A versioned approved routing matrix','Raw transcripts only','One global score'],1,'The harness should consume versioned routing configuration.'],
['Evaluation Routing','Why evaluate the execution profile rather than only the model?',['Models do not matter','Tools, retrieval, prompts, reasoning settings and context also affect behavior','Profiles eliminate updates','Only latency matters'],1,'The whole profile produces production behavior.'],
['Routing Drift','A certified profile degrades on a newly common source pattern. Safest immediate response?',['Let the agent rewrite policy','Use an already-certified fallback for that task class and trigger re-evaluation','Ignore it','Switch all traffic to newest model'],1,'Runtime protection uses certified fallbacks; policy changes require re-certification.'],
['Routing Drift','Which loop best avoids unsafe self-modifying routing?',['Metric → LLM route → production','Evidence → deterministic detector → safe fallback → curated eval → re-certification → versioned route','Failure → retrain → deploy','Latency alert → larger model'],1,'Separate automatic protection from controlled policy evolution.'],
['Routing Drift','Why version prompt, retrieval and tool-registry configuration with a profile?',['Increase context','Explain degradation and reproduce certification','Bypass evaluation','Fix HTTP errors'],1,'Profile provenance enables attribution and reproducibility.'],
['RAG Evaluation','Required evidence never appears in top-K and the answer is wrong. Investigate first?',['Generator prompt','Retriever/retrieval strategy','Formatter','Temperature'],1,'Diagnose missing evidence before generation.'],
['RAG Evaluation','Correct evidence reaches the model, but the answer contradicts it. Primary failure?',['Retrieval recall','Generation/reasoning/grounding','Metadata filtering','Candidate generation'],1,'Good evidence plus bad answer points downstream.'],
['RAG Evaluation','High Recall@K but poor MRR means what?',['Evidence is absent','Relevant evidence exists but may rank too low','MRR measures latency','They are identical'],1,'MRR rewards placing the first relevant result near the top.'],
['Retrieval Strategy','Best natural profile for exact error code ERR-1042?',['Lexical/BM25','Vector only','Four semantic subqueries','No retrieval'],0,'Exact identifiers often favor lexical matching.'],
['Retrieval Strategy','Purpose of candidate retrieval followed by reranking?',['Expensive ranking over entire corpus','Optimize recall cheaply, then spend more on ordering a shortlist','Replace authorization','Guarantee generation'],1,'Two-stage retrieval separates finding evidence from ranking it.'],
['Retrieval Strategy','Why are tenant/ACL filters more than relevance tuning?',['They change embeddings','They are deterministic security boundaries','They always lower recall','Rerankers cannot use metadata'],1,'Unauthorized evidence must be blocked before model exposure.'],
['Query Routing','Exact API identifier, no other constraints: preferred simple route?',['Lexical','Deep decomposition','Vector only','No retrieval'],0,'Deterministic identifier signals can route to lexical search.'],
['Query Routing','Strongest evaluation of a retrieval router?',['Only label accuracy','Evidence quality such as Recall@K/MRR from its selected profile versus evaluated alternatives','Prompt length','Self-grading'],1,'The important outcome is retrieved evidence quality, not label agreement alone.'],
['Query Routing','When introduce an LLM retrieval classifier?',['Always','After deterministic features show a measurable limitation, with output constrained to approved profiles','Whenever vectors exist','For exact IDs'],1,'Use model routing only where ambiguity earns its cost and nondeterminism.'],
['Query Transformation','A compound question asks about retry, authentication and target migration patterns. Best treatment?',['One unchanged search always','Bounded decomposition preserving constraints, then merge/deduplicate/rerank','Invent missing settings','Answer subqueries and ignore original'],1,'Decompose evidence needs while keeping the original query authoritative.'],
['Query Transformation','Which query should normally stay literal?',['Conversational synonym-rich question','Exact policy number or code symbol','Multi-part comparison','Vague request'],1,'Rewriting exact identifiers can destroy lexical matches.']];
const q=document.getElementById('quiz');Q.forEach((x,i)=>{let h=`<div class=q><b>${i+1}. ${x[1]}</b>`;x[2].forEach((o,j)=>h+=`<label><input type=radio name=q${i} value=${j}> ${o}</label>`);q.insertAdjacentHTML('beforeend',h+'</div>')});const btn=document.getElementById('submit'),st=document.getElementById('status'),res=document.getElementById('results');btn.onclick=()=>{let p=[],miss=[];Q.forEach((x,i)=>{let e=document.querySelector(`input[name=q${i}]:checked`);p[i]=e?+e.value:null;if(!e)miss.push(i+1)});if(miss.length){st.textContent=' Answer all questions. Missing: '+miss.join(', ');return}let s=0,d={};Q.forEach((x,i)=>{d[x[0]]??=[0,0];d[x[0]][1]++;if(p[i]===x[3]){s++;d[x[0]][0]++}});let level=s>=18?'Architect-level':s>=15?'Strong':s>=11?'Developing':'Foundation';let h=`<h2>Score: ${s}/20 — ${level}</h2><h3>Domain assessment</h3>`;Object.entries(d).forEach(([k,v])=>{let pc=Math.round(v[0]/v[1]*100);h+=`<p>${k}: <b>${v[0]}/${v[1]}</b> · ${pc}%</p><div class=bar><i style="width:${pc}%"></i></div>`});h+='<h3>Answer review</h3>';Q.forEach((x,i)=>{let ok=p[i]===x[3];h+=`<p><b>${i+1}. ${ok?'Correct':'Incorrect'}</b><br>Your answer: ${x[2][p[i]]}${ok?'':`<br>Correct answer: ${x[2][x[3]]}`}<br><span class=muted>${x[4]}</span></p>`});res.innerHTML=h;res.classList.remove('hidden');document.querySelectorAll('input').forEach(e=>e.disabled=true);btn.disabled=true;st.textContent=' Exam submitted.';res.scrollIntoView({behavior:'smooth'})};</script></body></html>
