<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Weekly AI Architecture Exam — 2026-09-20</title><style>:root{color-scheme:light dark;--bg:#f6f7f9;--card:#fff;--text:#111827;--muted:#6b7280;--border:#d1d5db;--accent:#2563eb;--ok:#166534;--bad:#991b1b}@media(prefers-color-scheme:dark){:root{--bg:#0b1020;--card:#111827;--text:#f3f4f6;--muted:#9ca3af;--border:#374151;--accent:#60a5fa;--ok:#86efac;--bad:#fca5a5}}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,sans-serif}.wrap{max-width:900px;margin:auto;padding:24px}.muted{color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0}.stat,.question,.result{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px}.stat b{display:block;font-size:1.5rem}.question{margin:14px 0}.question h3{margin:0 0 12px;font-size:1rem}.option{display:flex;gap:10px;padding:8px 0}.option input{margin-top:5px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:24px 0}.btn{border:1px solid var(--border);border-radius:10px;padding:11px 16px;font-weight:600;background:var(--card);color:var(--text);cursor:pointer}.primary{background:var(--accent);color:white;border-color:var(--accent)}.hidden{display:none}.score{font-size:2rem;font-weight:700}.domain{margin:10px 0}.bar{height:10px;border-radius:10px;background:var(--border);overflow:hidden}.bar span{display:block;height:100%;background:var(--accent)}.review-item{border-top:1px solid var(--border);padding:12px 0}.correct{color:var(--ok);font-weight:700}.incorrect{color:var(--bad);font-weight:700}@media(max-width:600px){.wrap{padding:16px}.stats{grid-template-columns:1fr}}</style></head><body><main class="wrap"><h1>Weekly AI Agents Architecture Exam</h1><div class="muted">Based on material published 14–20 Sep 2026 · 20 MCQs · explanations after submission</div><div class="stats"><div class="stat"><span class="muted">Questions</span><b>20</b></div><div class="stat"><span class="muted">Marks</span><b>20</b></div><div class="stat"><span class="muted">Level</span><b>Architect</b></div></div><div id="quiz"></div><div class="actions"><button id="submit" class="btn primary">Submit Exam</button><button id="reset" class="btn">Reset</button><span id="status" class="muted"></span></div><section id="results" class="hidden"></section></main><script>const qs=[
{d:'Adaptive Routing',q:'A migration agent uses its strongest model for file inventory, code generation, and semantic repair. What is the better architecture?',o:['Choose one model per agent run','Route each bounded step to the least expensive approved profile that can reliably satisfy its risk and quality needs','Always start cheap and retry until success','Let the LLM freely select any available model'],a:1,e:'Execution profiles should be selected per step using task difficulty, risk, remaining budget and quality gates.'},
{d:'Adaptive Routing',q:'A cheap profile fails a deterministic quality gate on a high-risk repair. What should happen?',o:['Accept because the model completed the task','Use a controlled escalation to a stronger approved profile if budget permits','Repeat the same cheap profile indefinitely','Remove the quality gate'],a:1,e:'Observable quality failure is a valid escalation signal; escalation remains bounded and budgeted.'},
{d:'Adaptive Routing',q:'Why is prompt length alone a weak routing signal?',o:['Long prompts are always easy','Difficulty and risk are not determined by length; short security decisions may require stronger controls','Token count cannot be measured','Only tool count matters'],a:1,e:'Routing should consider task class, risk, evidence and observed failures, not input size alone.'},
{d:'Evaluation Routing',q:'Offline results show Economy passes inventory at 98%, Standard at 99%, and Deep at 99%; the required rate is 95%. Which route best follows evaluation-driven routing?',o:['Deep, because it has maximum capability','Standard, because it is safer than Economy','Economy, assuming safety and other gates also pass with sufficient margin','Randomly rotate all profiles'],a:2,e:'Choose the least expensive profile that reliably clears all task-specific quality and risk gates.'},
{d:'Evaluation Routing',q:'What should the evaluation pipeline publish for production routing?',o:['A prompt asking the model to choose','A versioned approved routing matrix mapping task classes to certified execution profiles','Raw benchmark transcripts only','A single global quality score'],a:1,e:'Evaluation evidence should become versioned configuration consumed deterministically by the runtime harness.'},
{d:'Evaluation Routing',q:'Why should an execution profile be evaluated rather than only its model?',o:['Models have no effect on quality','Retrieval depth, tools, prompts, reasoning settings and context construction materially affect behavior','Profiles eliminate model updates','Only tool latency matters'],a:1,e:'Production behavior is produced by the whole execution profile, not by the model in isolation.'},
{d:'Routing Drift',q:'A previously certified profile begins failing on a newly common source pattern. What is the safest immediate response?',o:['Let the agent rewrite its own routing policy','Use an already-certified fallback for the affected task class and trigger re-evaluation','Ignore it until the next model release','Switch all traffic to the newest model'],a:1,e:'Runtime protection should use a certified fallback; permanent routing changes require controlled re-certification.'},
{d:'Routing Drift',q:'Which loop best avoids unsafe self-modifying routing?',o:['Production metric → LLM chooses route → production','Production evidence → deterministic detector → safe fallback → curated eval → re-certification → versioned route','Failure → immediately retrain → deploy','Latency alert → choose larger model'],a:1,e:'Online evidence may trigger protection, but policy evolution should pass through curated evaluation and versioned release.'},
{d:'Routing Drift',q:'Why should profile provenance include prompt, retrieval and tool-registry versions?',o:['To increase context size','To explain degradation and reproduce the certified configuration','To let the model bypass evaluation','To make HTTP errors disappear'],a:1,e:'A profile is a deployable artifact; provenance is necessary to attribute drift and reproduce results.'},
{d:'RAG Evaluation',q:'A RAG answer is wrong. The required document never appears in top-K retrieval. Which component should be investigated first?',o:['Generator prompt','Retriever and retrieval strategy','Answer formatter','Model temperature only'],a:1,e:'If evidence was not retrieved, generation cannot reliably use it; diagnose retrieval before blaming the model.'},
{d:'RAG Evaluation',q:'The correct evidence is retrieved and passed to the model, but the answer contradicts it. What failed most directly?',o:['Retrieval recall','Generation, reasoning or grounding','Metadata filtering','Candidate generation'],a:1,e:'Good evidence with a bad answer points downstream to evidence use rather than evidence discovery.'},
{d:'RAG Evaluation',q:'Why is a high Recall@K with poor MRR potentially problematic?',o:['All relevant evidence is absent','Relevant evidence exists in the result set but may be ranked too low, increasing distraction and downstream context pressure','MRR measures latency','Recall and MRR are identical'],a:1,e:'Recall measures whether relevant items are found; reciprocal rank rewards placing the first relevant item near the top.'},
{d:'Retrieval Strategy',q:'Which retrieval profile is most naturally suited to an exact error code such as ERR-1042?',o:['Lexical/BM25','Pure vector search only','Query decomposition into four semantic queries','LLM generation without retrieval'],a:0,e:'Exact identifiers and rare tokens are often best served by lexical matching.'},
{d:'Retrieval Strategy',q:'What is the main purpose of two-stage candidate retrieval followed by reranking?',o:['Use expensive ranking over the entire corpus','First optimize recall cheaply, then spend more computation ordering a smaller candidate set','Replace authorization filtering','Guarantee the generator is correct'],a:1,e:'Candidate generation finds evidence broadly; reranking improves ordering within the shortlist.'},
{d:'Retrieval Strategy',q:'Why should tenant or ACL filtering not be treated merely as relevance tuning?',o:['It changes embeddings','It is a security boundary that must deterministically prevent unauthorized evidence from reaching the model','It always lowers recall','Rerankers cannot process metadata'],a:1,e:'Entitlement constraints enforce access, so they must be applied deterministically before model exposure.'},
{d:'Query Routing',q:'A query contains an exact API identifier and no other constraints. What should a simple retrieval router generally prefer?',o:['Lexical profile','Deep semantic decomposition','Vector-only profile regardless of evaluation','No retrieval'],a:0,e:'A deterministic identifier signal can route directly to a pre-approved lexical profile.'},
{d:'Query Routing',q:'What is the strongest way to evaluate a retrieval router?',o:['Only compare its chosen label with a human label','Measure evidence quality such as Recall@K/MRR from the selected profile against an oracle or evaluated alternatives','Measure prompt length','Ask the router to grade itself'],a:1,e:'Router label accuracy is secondary to whether its chosen profile actually retrieves the required evidence efficiently.'},
{d:'Query Routing',q:'When should an LLM classifier be introduced into retrieval routing?',o:['For every query by default','Only after simpler deterministic features show a measurable limitation and output is constrained to approved profiles','Whenever vector search exists','Only for exact identifiers'],a:1,e:'Rule-based routing is cheaper and predictable; use an LLM only where ambiguity justifies it and constrain its choices.'},
{d:'Query Transformation',q:'A user asks one compound question about retry behavior, authentication, and target migration patterns. What is the best retrieval treatment?',o:['Send the entire question unchanged to one search regardless of results','Decompose into bounded subqueries that preserve the original constraints, then merge, deduplicate and rerank evidence','Invent missing target settings to make searches specific','Answer each subquery independently and ignore the original question'],a:1,e:'Decomposition separates information needs while the original query remains the source of truth for final answering.'},
{d:'Query Transformation',q:'Which query should normally be kept literal rather than rewritten?',o:['A conversational question with ambiguous synonyms','An exact policy number or code symbol','A multi-part comparison','A vague natural-language request'],a:1,e:'Rewriting exact identifiers can destroy lexical matches; transformation is selective, not mandatory.'}
];const quiz=document.getElementById('quiz');qs.forEach((x,i)=>{const s=document.createElement('section');s.className='question';s.innerHTML=`<h3>${i+1}. ${x.q}</h3>`;x.o.forEach((v,j)=>{const r=document.createElement('label');r.className='option';r.innerHTML=`<input type="radio" name="q${i}" value="${j}"><span>${v}</span>`;s.appendChild(r)});quiz.appendChild(s)});function level(n){if(n>=18)return['Architect-level','Strong command of adaptive routing, evaluation, drift controls and retrieval architecture.'];if(n>=15)return['Strong','Good architectural understanding; revisit domains below 75%.'];if(n>=11)return['Developing','Core concepts are present, but some evaluation and retrieval boundaries need reinforcement.'];return['Foundation','Revisit execution-profile routing, continuous evaluation and the retrieval pipeline.']}function submit(){const p=[],m=[];qs.forEach((_,i)=>{const e=document.querySelector(`input[name=q${i}]:checked`);p.push(e?+e.value:null);if(!e)m.push(i+1)});if(m.length){status.textContent=`Answer all questions. Missing: ${m.join(', ')}`;return}let score=0,ds={};qs.forEach((x,i)=>{ds[x.d]??={c:0,t:0};ds[x.d].t++;if(p[i]===x.a){score++;ds[x.d].c++}});const [lv,msg]=level(score),out=document.getElementById('results');out.classList.remove('hidden');let h=`<div class="result"><div class="muted">Score</div><div class="score">${score}/20</div><h2>${lv}</h2><p>${msg}</p></div><div class="result"><h2>Domain assessment</h2>`;Object.entries(ds).forEach(([k,v])=>{const pc=Math.round(v.c/v.t*100);h+=`<div class="domain"><div>${k}: <b>${v.c}/${v.t}</b> · ${pc}%</div><div class="bar"><span style="width:${pc}%"></span></div></div>`});h+='</div><div class="result"><h2>Answer review</h2>';qs.forEach((x,i)=>{const ok=p[i]===x.a;h+=`<div class="review-item"><div class="${ok?'correct':'incorrect'}">${i+1}. ${ok?'Correct':'Incorrect'}</div><div>Your answer: ${x.o[p[i]]}</div>${ok?'':`<div>Correct answer: ${x.o[x.a]}</div>`}<div class="muted">${x.e}</div></div>`});out.innerHTML=h+'</div>';document.querySelectorAll('input').forEach(x=>x.disabled=true);submit.disabled=true;status.textContent='Exam submitted.';out.scrollIntoView({behavior:'smooth'})}const submit=document.getElementById('submit'),status=document.getElementById('status');submit.onclick=submit;document.getElementById('reset').onclick=()=>location.reload();</script></body></html>
