<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Weekly AI Agents Architecture Exam — 2026-09-13</title>
  <style>
    :root { color-scheme: light dark; --bg:#f6f7f9; --card:#fff; --text:#111827; --muted:#6b7280; --border:#d1d5db; --accent:#2563eb; --ok:#166534; --bad:#991b1b; }
    @media (prefers-color-scheme: dark){:root{--bg:#0b1020;--card:#111827;--text:#f3f4f6;--muted:#9ca3af;--border:#374151;--accent:#60a5fa;--ok:#86efac;--bad:#fca5a5}}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}.wrap{max-width:900px;margin:auto;padding:24px}.hero{margin-bottom:24px}.hero h1{margin:0 0 8px;font-size:clamp(1.6rem,4vw,2.4rem)}.muted{color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0}.stat,.question,.result{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px}.stat b{display:block;font-size:1.5rem}.question{margin:14px 0}.question h3{margin:0 0 12px;font-size:1rem}.option{display:flex;gap:10px;align-items:flex-start;padding:8px 0}.option input{margin-top:4px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:24px 0}.btn{border:1px solid var(--border);border-radius:10px;padding:11px 16px;font-weight:600;background:var(--card);color:var(--text);cursor:pointer}.btn.primary{background:var(--accent);color:white;border-color:var(--accent)}.btn:disabled{opacity:.5;cursor:not-allowed}.hidden{display:none}.score{font-size:2rem;font-weight:700}.domain{margin:10px 0}.bar{height:10px;border-radius:10px;background:var(--border);overflow:hidden}.bar span{display:block;height:100%;background:var(--accent)}.review-item{border-top:1px solid var(--border);padding:12px 0}.correct{color:var(--ok);font-weight:700}.incorrect{color:var(--bad);font-weight:700}@media(max-width:600px){.wrap{padding:16px}.stats{grid-template-columns:1fr}.question{padding:14px}}
  </style>
</head>
<body>
<main class="wrap">
  <section class="hero">
    <h1>Weekly AI Agents Architecture Exam</h1>
    <div class="muted">Based on material published 7–13 Sep 2026 · 20 MCQs · explanations after submission</div>
    <div class="stats"><div class="stat"><span class="muted">Questions</span><b>20</b></div><div class="stat"><span class="muted">Marks</span><b>20</b></div><div class="stat"><span class="muted">Level</span><b>Architect</b></div></div>
  </section>
  <div id="quiz"></div>
  <div class="actions"><button id="submit" class="btn primary">Submit Exam</button><button id="reset" class="btn">Reset</button><span id="status" class="muted"></span></div>
  <section id="results" class="hidden"></section>
</main>
<script>
const qs=[
{d:'Capability Governance',q:'A migration agent has 80 registered tools, but only four are relevant during source analysis. Which architecture best follows the week’s guidance?',o:['Send all 80 tools and tell the model to ignore unsafe ones','Filter the registry using identity, workflow stage, environment and risk before exposing tool definitions','Let the model discover hidden tools by asking the registry directly','Expose all read and write tools but require approval only after execution'],a:1,e:'Tool discovery is part of authorization. The model should receive only the capabilities allowed for the current request context.'},
{d:'Capability Governance',q:'Why should a tool invocation be authorized again immediately before execution even if the tool was allowed during discovery?',o:['Because discovery-time filtering is only a usability feature','Because concrete arguments, identity, environment or policy may have changed since prompt assembly','Because LLMs cannot remember tool schemas','Because MCP annotations expire after one turn'],a:1,e:'Discovery-time filtering reduces exposure, but execution-time authorization is the actual security boundary for the exact invocation.'},
{d:'Capability Governance',q:'How should an enterprise platform treat MCP metadata such as destructiveHint or readOnlyHint?',o:['As authoritative security policy from the tool server','As useful behavioral metadata that must be enriched and verified by trusted enterprise policy','As a replacement for user authorization','As model instructions that bypass runtime checks'],a:1,e:'Protocol annotations are useful hints, but trusted organization-owned metadata and policy must remain authoritative.'},
{d:'Identity & Delegation',q:'A user asks an agent to create a pull request. Which identity model gives the clearest authorization and audit trail?',o:['Use one shared repository token for every user','Preserve both the subject identity of the user and the actor identity of the agent workload','Replace the user identity with the workload identity after authentication','Pass the user bearer token directly through every agent component'],a:1,e:'Enterprise tool calls should preserve both who requested the action and which workload executed it.'},
{d:'Identity & Delegation',q:'Where should a downstream access token normally be obtained for an agent tool call?',o:['Inside the prompt so the model can choose scopes','At the tool boundary from a trusted credential broker using narrow audience, scope and TTL','At workflow start and persisted for later use','From a model-generated identity claim'],a:1,e:'Short-lived audience-specific credentials should be materialized at the execution boundary, not propagated through model context.'},
{d:'Identity & Delegation',q:'Why is forwarding an incoming user access token to every downstream tool a weak default?',o:['OAuth tokens cannot cross process boundaries','The token may target the wrong audience and carry broader authority than the selected tool requires','The workload identity becomes impossible to authenticate','Short-lived tokens cannot be audited'],a:1,e:'A broad inbound token may have the wrong audience or excessive privileges; token exchange preserves narrower delegated authority.'},
{d:'Long-Running Authorization',q:'A workflow waits six hours for approval before deployment. What should be persisted across the pause?',o:['The original cloud access token','Authorization intent and evidence such as subject, actor, capability, resource and approval reference','A refresh token plus the original prompt','Only the model transcript'],a:1,e:'Durable state should identify the intended authority and its evidence, while bearer credentials are reacquired just in time.'},
{d:'Long-Running Authorization',q:'What is the safest resume sequence for a side-effecting action after a long pause?',o:['Load state → reuse stored token → execute','Load state → reconcile prior effects → revalidate authority → obtain fresh narrow credential → execute','Ask the LLM whether the prior approval still seems valid → execute','Renew the token automatically → skip policy because the workflow already started'],a:1,e:'Resume must re-establish current authority and reconcile state before any new side effect occurs.'},
{d:'Long-Running Authorization',q:'Which statement best distinguishes revalidation from re-authentication?',o:['They are identical','Revalidation checks current authority; re-authentication obtains fresh proof of identity only when required','Re-authentication is always required after every pause','Revalidation means refreshing an access token'],a:1,e:'A workflow may revalidate current policy without forcing user interaction unless identity assurance or policy requires it.'},
{d:'Approval Binding',q:'A reviewer approves deployment of version 2.3.0, but the agent later changes the action to version 2.3.1. What should happen?',o:['Execute because the intent to deploy was already approved','Invalidate the approval and require review of the new action','Execute if the model explains the change','Reuse approval if the environment is unchanged'],a:1,e:'Approval must bind to the exact immutable action envelope; changing a material parameter creates a new action.'},
{d:'Approval Binding',q:'Why should approval validation use a canonical action representation and fingerprint?',o:['To reduce model token usage','To deterministically prove that the executable action is the same one the human reviewed','To replace schema validation','To make every action idempotent'],a:1,e:'Canonicalization plus hashing binds the approval record to the exact tool, arguments and resource identity.'},
{d:'Approval Binding',q:'Which value is safest inside an approval-bound deployment action?',o:['artifact=latest','artifact_sha=<immutable digest>','artifact=most_recent_successful','artifact=whatever_passes_tests_at_execution_time'],a:1,e:'Mutable references can resolve differently after approval; immutable version or digest identifiers preserve the reviewed action.'},
{d:'Policy as Code',q:'What is the correct responsibility split between a Policy Decision Point (PDP) and Policy Enforcement Point (PEP)?',o:['PDP executes tools; PEP generates risk scores with the LLM','PDP evaluates trusted facts and returns a decision; PEP enforces that decision around execution','PDP stores tokens; PEP approves prompts','They are two names for the same component'],a:1,e:'The PDP decides; the PEP ensures the tool runs only according to the returned policy decision.'},
{d:'Policy as Code',q:'Why is ALLOW / APPROVAL_REQUIRED / DENY often a better policy model than simple allow/deny?',o:['It gives the LLM more choices','It represents actions that are valid only with additional human control without weakening deterministic policy','It removes the need for authorization','It lets users override forbidden actions'],a:1,e:'Human approval is a legitimate deterministic policy outcome distinct from both automatic execution and prohibition.'},
{d:'Policy as Code',q:'Which inputs should a risk policy trust most?',o:['The model’s description of environment and user role','Trusted runtime identity, tool metadata, resource, environment and workflow state','The natural-language rationale produced by the planner','A model-generated 0–100 safety score'],a:1,e:'Policy should use authoritative facts from runtime and trusted metadata, not model-supplied security attributes.'},
{d:'Execution Budgets',q:'An agent performs only individually authorized operations but loops through 80 model calls and 60 test runs. Which missing control does this reveal?',o:['More retrieval','A deterministic execution budget','A larger model','A broader approval scope'],a:1,e:'Authorization answers what is permitted; an execution budget limits how much autonomy and resource consumption the run may use.'},
{d:'Execution Budgets',q:'Why should a distributed multi-agent run have a parent run budget in addition to per-agent limits?',o:['To make prompts shorter','So handoffs or worker restarts cannot multiply total allowed consumption','Because individual agents cannot count tokens','To eliminate the need for tool-level budgets'],a:1,e:'Without a shared parent envelope, each specialist or resumed worker could independently consume a full budget.'},
{d:'Execution Budgets',q:'Why is reservation followed by settlement useful before expensive parallel operations?',o:['It lets the model estimate billing more accurately','It prevents concurrent operations from both spending the same remaining budget and later records actual usage','It replaces hard limits with soft limits','It makes retries free'],a:1,e:'Reservation protects shared capacity before execution; settlement reconciles the reservation against authoritative measured consumption.'},
{d:'Budget-Aware Planning',q:'A migration run has only two model turns and six tool calls left. What should a budget-aware planner prefer?',o:['Start broad repository discovery for the next migration unit','Finish the highest-value in-progress unit, run targeted validation, then checkpoint','Ignore remaining budget because the harness will stop eventually','Use all remaining calls for exploratory searches'],a:1,e:'Budget-aware planning changes behavior as resources become scarce, prioritizing feasible completion and resumability over new exploration.'},
{d:'Budget-Aware Planning',q:'Which architecture best separates hard budget enforcement from adaptive planning?',o:['Let the LLM maintain the authoritative counters and decide when to stop','Harness owns authoritative counters and hard limits; planner receives a safe budget view and proposes feasible next steps','Hide all budget information from both planner and harness','Use only a larger max_turns value and no other budget dimensions'],a:1,e:'The harness is authoritative for measurement and enforcement, while the planner may adapt using a bounded model-visible view such as normal, constrained or critical.'}
];
const quiz=document.getElementById('quiz');
qs.forEach((x,i)=>{const s=document.createElement('section');s.className='question';s.innerHTML=`<h3>${i+1}. ${x.q}</h3>`;x.o.forEach((v,j)=>{const row=document.createElement('label');row.className='option';row.innerHTML=`<input type="radio" name="q${i}" value="${j}"><span>${v}</span>`;s.appendChild(row)});quiz.appendChild(s)});
function level(n){if(n>=18)return['Architect-level','You can connect capability filtering, identity, approval, policy and budget controls into a coherent enterprise agent control plane.'];if(n>=15)return['Strong','Good architectural understanding; revisit any domain below 75%.'];if(n>=11)return['Developing','Core concepts are present, but some trust boundaries between model reasoning and deterministic controls need reinforcement.'];return['Foundation','Revisit the week’s progression from capability exposure through identity, approval, policy enforcement and bounded autonomy.']}
function submit(){const picks=[],missing=[];qs.forEach((_,i)=>{const e=document.querySelector(`input[name=q${i}]:checked`);picks.push(e?+e.value:null);if(!e)missing.push(i+1)});if(missing.length){document.getElementById('status').textContent=`Answer all questions. Missing: ${missing.join(', ')}`;return}let score=0;const ds={};qs.forEach((x,i)=>{ds[x.d]??={c:0,t:0};ds[x.d].t++;if(picks[i]===x.a){score++;ds[x.d].c++}});const [lv,msg]=level(score),out=document.getElementById('results');out.classList.remove('hidden');let html=`<div class="result"><div class="muted">Score</div><div class="score">${score}/20</div><h2>${lv}</h2><p>${msg}</p></div><div class="result"><h2>Domain assessment</h2>`;Object.entries(ds).forEach(([k,v])=>{const p=Math.round(v.c/v.t*100);html+=`<div class="domain"><div>${k}: <b>${v.c}/${v.t}</b> · ${p}%</div><div class="bar"><span style="width:${p}%"></span></div></div>`});html+='</div><div class="result"><h2>Answer review</h2>';qs.forEach((x,i)=>{const ok=picks[i]===x.a;html+=`<div class="review-item"><div class="${ok?'correct':'incorrect'}">${i+1}. ${ok?'Correct':'Incorrect'}</div><div>Your answer: ${x.o[picks[i]]}</div>${ok?'':`<div>Correct answer: ${x.o[x.a]}</div>`}<div class="muted">${x.e}</div></div>`});html+='</div>';out.innerHTML=html;document.querySelectorAll('input[type=radio]').forEach(x=>x.disabled=true);document.getElementById('submit').disabled=true;document.getElementById('status').textContent='Exam submitted.';out.scrollIntoView({behavior:'smooth'})}
document.getElementById('submit').addEventListener('click',submit);document.getElementById('reset').addEventListener('click',()=>{document.querySelectorAll('input[type=radio]').forEach(x=>{x.checked=false;x.disabled=false});document.getElementById('results').classList.add('hidden');document.getElementById('results').innerHTML='';document.getElementById('submit').disabled=false;document.getElementById('status').textContent=''});
</script>
</body>
</html>
