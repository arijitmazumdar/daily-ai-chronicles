<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Weekly AI Agents Architecture Exam</title>
  <style>
    :root { color-scheme: light dark; --bg:#f6f7f9; --card:#fff; --text:#111827; --muted:#6b7280; --border:#d1d5db; --accent:#2563eb; --ok:#166534; --bad:#991b1b; }
    @media (prefers-color-scheme: dark){:root{--bg:#0b1020;--card:#111827;--text:#f3f4f6;--muted:#9ca3af;--border:#374151;--accent:#60a5fa;--ok:#86efac;--bad:#fca5a5}}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}.wrap{max-width:900px;margin:auto;padding:24px}.hero{margin-bottom:24px}.hero h1{margin:0 0 8px;font-size:clamp(1.6rem,4vw,2.4rem)}.muted{color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0}.stat,.question,.result{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px}.stat b{display:block;font-size:1.5rem}.question{margin:14px 0}.question h3{margin:0 0 12px;font-size:1rem}.option{display:flex;gap:10px;align-items:flex-start;padding:8px 0}.option input{margin-top:4px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:24px 0}.btn{border:1px solid var(--border);border-radius:10px;padding:11px 16px;font-weight:600;background:var(--card);color:var(--text);cursor:pointer}.btn.primary{background:var(--accent);color:white;border-color:var(--accent)}.btn:disabled{opacity:.5;cursor:not-allowed}.hidden{display:none}.score{font-size:2rem;font-weight:700}.domain{margin:10px 0}.bar{height:10px;border-radius:10px;background:var(--border);overflow:hidden}.bar span{display:block;height:100%;background:var(--accent)}.review-item{border-top:1px solid var(--border);padding:12px 0}.correct{color:var(--ok);font-weight:700}.incorrect{color:var(--bad);font-weight:700}@media(max-width:600px){.wrap{padding:16px}.stats{grid-template-columns:1fr}.question{padding:14px}}
  </style>
</head>
<body>
<main class="wrap">
  <section class="hero">
    <h1>Weekly AI Agents Architecture Exam</h1>
    <div class="muted">Based on material published 24–30 Aug 2026 · 20 MCQs · explanations after submission</div>
    <div class="stats"><div class="stat"><span class="muted">Questions</span><b>20</b></div><div class="stat"><span class="muted">Marks</span><b>20</b></div><div class="stat"><span class="muted">Level</span><b>Architect</b></div></div>
  </section>
  <div id="quiz"></div>
  <div class="actions"><button id="submit" class="btn primary">Submit Exam</button><button id="reset" class="btn">Reset</button><span id="status" class="muted"></span></div>
  <section id="results" class="hidden"></section>
</main>
<script>
const qs=[
{d:'Agentic RAG',q:'A migration agent is asked, “What stage is this migration in?” The state is already present in its authoritative run state. What should the retrieval router do?',o:['Search all indexed documents to maximize confidence','Skip retrieval and answer from the authoritative state already available','Always query the vector database because every user turn requires RAG','Query source code because implementation evidence is always superior'],a:1,e:'Agentic RAG makes retrieval a governed decision. If sufficient authoritative evidence is already available, retrieval should be skipped.'},
{d:'Agentic RAG',q:'A user asks which flows use retry logic, whether those calls are non-idempotent, and whether they violate the target retry standard. What is the best retrieval strategy?',o:['Embed the full question once and query one index','Decompose the question into distinct evidence needs and route each to its authoritative source','Search every source in parallel regardless of cost','Ask the LLM to answer first and retrieve only if challenged'],a:1,e:'Complex requests should be decomposed into evidence needs and routed to the source that owns each fact.'},
{d:'Agentic RAG',q:'Which responsibility belongs primarily to the retrieval harness rather than the LLM planner?',o:['Proposing a query rewrite','Identifying a missing evidence gap','Enforcing authorization, retrieval budgets, and stop conditions','Semantically interpreting whether a document supports a claim'],a:2,e:'The model can propose semantic actions, but authority, budgets and termination remain deterministic harness responsibilities.'},
{d:'Agentic RAG',q:'A sufficiency judge says one evidence slot is still missing, but max_calls has already been reached. What should a production system do?',o:['Let the model override max_calls if confidence is low','Stop and expose the unresolved gap or escalate','Keep searching until all slots are filled','Answer as though evidence were complete'],a:1,e:'Semantic sufficiency decides whether more evidence would help; deterministic budgets decide whether more retrieval is allowed.'},
{d:'Agentic RAG',q:'Why can additional retrieval reduce answer quality after several successful searches?',o:['Vector databases become unavailable after repeated calls','Later retrieval may add duplicates or distractors while increasing latency and token cost','The model forgets earlier evidence after each search','Retrieval automatically invalidates previous citations'],a:1,e:'Retrieval has diminishing marginal utility; later searches can add noise and cost without meaningful evidence gain.'},
{d:'Observability',q:'Why is tracing only model API latency inadequate for an agent?',o:['Model latency cannot be measured','It hides planning, retrieval, tool, approval, retry and stopping decisions that determine behavior','Agents never call models directly','OpenTelemetry does not support LLM spans'],a:1,e:'Agent observability must reconstruct the full decision trajectory, not merely individual LLM calls.'},
{d:'Observability',q:'What is the preferred way to record why an agent chose a tool without storing unrestricted hidden reasoning?',o:['Persist the full chain-of-thought','Use bounded structured reason codes such as TEST_FAILURE or EVIDENCE_SUFFICIENT','Store the complete prompt and response for every step','Do not record any decision metadata'],a:1,e:'Stable reason codes are safer, aggregatable and useful for diagnosis without requiring unrestricted reasoning logs.'},
{d:'Observability',q:'Which metric gives the strongest architecture-level view of agent economics?',o:['Tokens per model call','Cost per successful task','Number of spans per trace','Average prompt length'],a:1,e:'Cost per successful task connects operational spend to verified business outcome rather than isolated requests or calls.'},
{d:'Offline Evals',q:'A production migration agent missed transaction semantics and a human corrected the result. What should the regression case assert?',o:['The exact Java source text produced by the human','Architectural invariants such as transaction discovery, planning and semantic preservation','The original model response verbatim','The exact sequence of all tool calls'],a:1,e:'Stable semantic and architectural invariants survive model, prompt and implementation changes better than exact generated text.'},
{d:'Offline Evals',q:'Why should tools usually be stubbed or sandboxed during offline replay?',o:['To make the model deterministic','To avoid repeating live side effects such as commits, customer updates or cloud-resource creation','Because evaluation frameworks cannot call tools','To make trace IDs reusable'],a:1,e:'Offline replay must reproduce decision conditions without accidentally executing production side effects.'},
{d:'Offline Evals',q:'Which production traces should be promoted into an eval dataset?',o:['Every trace indefinitely','Only failed traces','Curated failures, human corrections, unusual runs, and representative successful edge cases','Only traces with the highest token count'],a:2,e:'The dataset should be curated and representative, not a raw copy of production traffic or only failures.'},
{d:'Offline Evals',q:'Where should deterministic assertions be preferred over an LLM judge?',o:['Whether generated code compiles and required schema fields exist','Whether an explanation is concise and persuasive','Whether a plan is elegantly written','Whether a response tone is appropriate'],a:0,e:'Machine-verifiable invariants such as compilation, schemas, authorization and exact state should be evaluated deterministically.'},
{d:'Release Gates',q:'A candidate agent has a better average semantic score but introduces one critical authorization violation. What should the release gate do?',o:['Promote because the weighted average improved','Reject because zero-tolerance safety gates cannot be averaged away','Ask an LLM judge to make the final release decision','Increase the regression budget'],a:1,e:'Hard gates protect invariants that must never regress; aggregate quality cannot compensate for a critical policy violation.'},
{d:'Release Gates',q:'Why should baseline and candidate be evaluated on the same versioned dataset and environment?',o:['To reduce the number of evaluator models','To make regression comparison valid and attributable','Because canary releases require identical production traffic','Because prompt versions do not matter'],a:1,e:'Changing test cases or environment during comparison confounds the experiment and weakens release evidence.'},
{d:'Release Gates',q:'Which pair is best classified as hard gate versus regression-budget metric?',o:['Authorization violations = hard gate; average tool calls = regression budget','Average tool calls = hard gate; authorization violations = regression budget','Latency = always hard gate; compilation = always regression budget','All metrics should use one aggregate score'],a:0,e:'Safety and deterministic contract invariants are commonly zero-tolerance; cost, latency and efficiency often use bounded regression budgets.'},
{d:'Release Gates',q:'Who should hold final authority to promote a candidate after eval results are produced?',o:['The LLM that generated the candidate','A deterministic delivery/release controller applying version-controlled policy','The LLM judge that scored semantic quality','The retrieval router'],a:1,e:'Models and evaluators provide evidence; release authority remains deterministic, auditable deployment policy.'},
{d:'Online Evals',q:'What is the core distinction between offline and online evaluation?',o:['Offline evals test known cases before release; online evals assess behavior under real production distributions after limited exposure','Offline evals use models; online evals cannot','Online evals replace canaries','Offline evals are only for RAG systems'],a:0,e:'Offline evaluation is pre-release evidence; online evaluation measures real-traffic behavior and residual risk.'},
{d:'Online Evals',q:'Which condition belongs in a synchronous request-path guardrail rather than an asynchronous sampled evaluator?',o:['Groundedness quality trend','Critical unauthorized tool invocation','Weekly cost-per-success analysis','Semantic plan quality across 500 traces'],a:1,e:'Conditions that must be blocked immediately belong in synchronous guardrails; broader quality analysis can run asynchronously.'},
{d:'Online Evals',q:'A candidate receives 5% traffic and shows task success within budget but p95 latency exceeds the predefined limit. What should the release controller do?',o:['Promote because task success is acceptable','Hold or rollback according to the predefined canary policy','Let the candidate decide whether the latency matters','Increase canary traffic to gather more failures'],a:1,e:'Canary policy should define operational guardrails such as p95 latency before rollout begins and act deterministically on violations.'},
{d:'Online Evals',q:'Why is it dangerous to compare baseline and candidate when they receive materially different traffic segments?',o:['Trace IDs may collide','Observed quality differences may reflect traffic mix rather than the candidate change','The candidate will always appear slower','The baseline cannot emit telemetry'],a:1,e:'A fair canary comparison needs comparable traffic or explicit segmentation; otherwise workload differences confound the result.'}
];
const quiz=document.getElementById('quiz');
qs.forEach((x,i)=>{const s=document.createElement('section');s.className='question';s.innerHTML=`<h3>${i+1}. ${x.q}</h3>`;x.o.forEach((v,j)=>{const row=document.createElement('label');row.className='option';row.innerHTML=`<input type="radio" name="q${i}" value="${j}"><span>${v}</span>`;s.appendChild(row)});quiz.appendChild(s)});
function level(n){if(n>=18)return['Architect-level','You can connect retrieval control, observability, evaluation evidence and release policy into one production control plane.'];if(n>=15)return['Strong','Good architectural understanding; revisit any domain below 75%.'];if(n>=11)return['Developing','Core concepts are present, but some boundaries between semantic judgment and deterministic authority need reinforcement.'];return['Foundation','Revisit the week’s control-loop mental model: retrieve deliberately, trace decisions, convert failures to evals, gate releases and validate online.']}
function submit(){const picks=[],missing=[];qs.forEach((_,i)=>{const e=document.querySelector(`input[name=q${i}]:checked`);picks.push(e?+e.value:null);if(!e)missing.push(i+1)});if(missing.length){document.getElementById('status').textContent=`Answer all questions. Missing: ${missing.join(', ')}`;return}let score=0;const ds={};qs.forEach((x,i)=>{ds[x.d]??={c:0,t:0};ds[x.d].t++;if(picks[i]===x.a){score++;ds[x.d].c++}});const [lv,msg]=level(score),out=document.getElementById('results');out.classList.remove('hidden');let html=`<div class="result"><div class="muted">Score</div><div class="score">${score}/20</div><h2>${lv}</h2><p>${msg}</p></div><div class="result"><h2>Domain assessment</h2>`;Object.entries(ds).forEach(([k,v])=>{const p=Math.round(v.c/v.t*100);html+=`<div class="domain"><div>${k}: <b>${v.c}/${v.t}</b> · ${p}%</div><div class="bar"><span style="width:${p}%"></span></div></div>`});html+='</div><div class="result"><h2>Answer review</h2>';qs.forEach((x,i)=>{const ok=picks[i]===x.a;html+=`<div class="review-item"><div class="${ok?'correct':'incorrect'}">${i+1}. ${ok?'Correct':'Incorrect'}</div><div>Your answer: ${x.o[picks[i]]}</div>${ok?'':`<div>Correct answer: ${x.o[x.a]}</div>`}<div class="muted">${x.e}</div></div>`});html+='</div>';out.innerHTML=html;document.querySelectorAll('input[type=radio]').forEach(x=>x.disabled=true);document.getElementById('submit').disabled=true;document.getElementById('status').textContent='Exam submitted.';out.scrollIntoView({behavior:'smooth'})}
document.getElementById('submit').addEventListener('click',submit);document.getElementById('reset').addEventListener('click',()=>{document.querySelectorAll('input[type=radio]').forEach(x=>{x.checked=false;x.disabled=false});document.getElementById('results').classList.add('hidden');document.getElementById('results').innerHTML='';document.getElementById('submit').disabled=false;document.getElementById('status').textContent=''});
</script>
</body>
</html>
